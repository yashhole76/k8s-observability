apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-backend
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels: {app: shop-backend}
  template:
    metadata:
      labels: {app: shop-backend}
    spec:
      containers:
        - name: backend
          image: yash7689/shop-backend:v2
          ports: [{name: http, containerPort: 3001}]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: shop-secrets, key: DATABASE_URL}}
            - name: PORT
              value: "3001"
            - name: FRONTEND_URL
              value: "http://localhost:3000"
            - name: NEXTAUTH_URL
              value: "http://localhost:3000"
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: shop-backend
  namespace: shop
  labels: {app: shop-backend}
spec:
  selector: {app: shop-backend}
  ports: [{name: http, port: 3001, targetPort: 3001}]
